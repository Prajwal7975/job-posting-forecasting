[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: fast, isolated unit tests with no filesystem/network/MLflow dependency
    integration: tests that exercise multiple components together, using tmp_path/tmp MLflow backends
    api: FastAPI TestClient-based tests against the salary prediction API
    slow: tests that are correct but too slow for the default CI run
    performance: deterministic but resource-heavy tests, excluded from default CI

addopts = -ra --strict-markers
